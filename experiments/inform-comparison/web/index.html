<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter Test · Inform comparison</title>
<link rel="stylesheet" href="interpreter/glkote.css"><link rel="stylesheet" href="interpreter/dialog.css">
<style>body{margin:0;background:#14191e;color:#f2efe7;font:16px system-ui}header{height:90px;padding:14px 24px;box-sizing:border-box;display:flex;align-items:center;gap:20px}h1{font-size:20px;margin:0}small{color:#bdc6cd}button{padding:8px 12px;border:1px solid #718899;background:#263642;color:white;cursor:pointer}#gameport{position:absolute;top:90px;bottom:0;left:0;right:0}#windowport{position:absolute;inset:0}#scene{position:fixed;right:20px;top:110px;z-index:100;width:280px;background:#263642;padding:20px;box-shadow:0 6px 40px #000}#scene[hidden]{display:none}#scene img{width:100%}.BufferWindow{background:#f5f0e6!important;color:#20262b!important}#errorpane{background:#900;color:white}#loadingpane{padding:40px}</style>
<header><div><h1>Counter Test</h1><small>Synthetic Inform 7 experiment · separate saves</small></div><button id="overlay">Scene / help</button><button id="export">Export visible transcript</button></header>
<aside id="scene" hidden><img src="counter.svg" alt="Synthetic cafe counter with cup and photograph"><p>Presentation-only overlay. The Inform VM owns all world state.</p><p>Try STATE, TAKE CUP, SIP COFFEE, ASK ROWAN ABOUT COMPLAINT, CHECK LEDGER, NORTH, WAIT. SAVE and RESTORE use interpreter storage on this origin.</p><button id="close">Close</button></aside>
<div id="gameport"><div id="windowport"></div><div id="loadingpane">Loading local interpreter…</div><div id="errorpane" style="display:none"><div id="errorcontent"></div></div></div>
<script src="interpreter/jquery-1.12.4.min.js"></script><script src="interpreter/glkote.min.js"></script><script src="interpreter/quixe.min.js"></script><script src="interpreter/resourcemap.js"></script>
<script>var game_options={image_info_map:'StaticImageInfo',use_query_story:false,set_page_title:false,inspacing:0,outspacing:0};
document.querySelector('#overlay').onclick=()=>document.querySelector('#scene').hidden=false;
document.querySelector('#close').onclick=()=>document.querySelector('#scene').hidden=true;
document.querySelector('#export').onclick=()=>{const text=Array.from(document.querySelectorAll('.BufferWindow')).map(e=>e.innerText).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='inform-comparison-visible-transcript.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script><script src="interpreter/story.js"></script></html>
